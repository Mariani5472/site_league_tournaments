services:
  - type: web
    name: ligas-api
    runtime: docker
    plan: free
    # Socket grants/revocations are process-local. Do not increase this value
    # or enable autoscaling before implementing distributed revocation.
    numInstances: 1
    rootDir: api
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    maxShutdownDelaySeconds: 30
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: INSTANCE_COUNT
        value: 1
      - key: REALTIME_REVOCATION_MODE
        value: local
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: 5
      - key: DB_CONNECTION_TIMEOUT_MS
        value: 5000
      - key: DB_IDLE_TIMEOUT_MS
        value: 10000
      - key: DB_STATEMENT_TIMEOUT_MS
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        sync: false
