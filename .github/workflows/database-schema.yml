name: Database schema

on:
  pull_request:
    paths:
      - "api/migrations/**"
      - "api/supabase/migrations/**"
      - "api/scripts/compare-database-schemas.mjs"
      - "api/scripts/adopt-migration-history.mjs"
      - "api/package*.json"
      - ".github/workflows/database-schema.yml"
  push:
    branches: [main, firstbranch]

jobs:
  migrate-and-compare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      CANONICAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_canonical
      BASELINE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_baseline
      UPGRADE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_upgrade
      LEGACY_REFERENCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schema_legacy_reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Create empty comparison databases
        run: |
          createdb schema_canonical
          createdb schema_baseline
          createdb schema_upgrade
          createdb schema_legacy_reference
      - name: Apply canonical incremental migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: ${{ env.CANONICAL_DATABASE_URL }}
      - name: Verify canonical migrations are fully applied
        run: npm run migrate:up
        env:
          DATABASE_URL: ${{ env.CANONICAL_DATABASE_URL }}
      - name: Build previous release schema
        id: previous
        shell: bash
        run: |
          psql "$BASELINE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260805210000_initial_schema.sql

          psql "$BASELINE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260820030000_add_user_operational_state.sql
        env:
          DATABASE_URL: ${{ env.LEGACY_REFERENCE_DATABASE_URL }}
      - name: Restore representative legacy schema without migration history
        run: |
          dropdb --if-exists schema_upgrade
          createdb --template=schema_legacy_reference schema_upgrade
          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP TABLE public.pgmigrations'
      - name: Verify legacy schema before adopting history
        run: npm run schema:compare -- "$LEGACY_REFERENCE_DATABASE_URL" "$UPGRADE_DATABASE_URL"
      - name: Adopt legacy migration history without replay
        run: npm run migrate:adopt -- "${{ steps.previous.outputs.name }}"
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
          REFERENCE_DATABASE_URL: ${{ env.LEGACY_REFERENCE_DATABASE_URL }}
      - name: Verify adopted cutoff
        run: |
          test "$(psql "$UPGRADE_DATABASE_URL" -Atc 'SELECT name FROM public.pgmigrations ORDER BY id DESC LIMIT 1')" = "${{ steps.previous.outputs.name }}"
      - name: Verify upgrade to current release
        run: npm run migrate:up
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
      - name: Verify latest migration rollback and reapply
        run: |
          npm run migrate:down
          npm run migrate:up
        env:
          DATABASE_URL: ${{ env.UPGRADE_DATABASE_URL }}
      - name: Apply legacy Supabase baseline
        run: |
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | while read -r file; do
            echo "Running $file"
            psql "$BASELINE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Detect structural divergence
        run: npm run schema:compare -- "$CANONICAL_DATABASE_URL" "$BASELINE_DATABASE_URL"
      - name: Adopt current Supabase baseline history
        shell: bash
        run: |
          head=$(find migrations -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort | tail -n 1 | sed 's/\.js$//')
          npm run migrate:adopt -- "$head"
          npm run migrate:up
        env:
          DATABASE_URL: ${{ env.BASELINE_DATABASE_URL }}
          REFERENCE_DATABASE_URL: ${{ env.CANONICAL_DATABASE_URL }}
      - name: Compare adopted upgrade with clean install
        run: npm run schema:compare -- "$CANONICAL_DATABASE_URL" "$UPGRADE_DATABASE_URL"
